[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketplace-sentinel"
version = "0.1.0"
description = "Çok pazaryerli kanal çakışması nöbetçisi: aynı ürün kanallar arasında farklı stok/fiyatla duruyorsa yalnızca yeni durumları bildirir."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Furkan Acar", email = "284462468+acar32furkan-glitch@users.noreply.github.com" }]
keywords = ["marketplace", "e-commerce", "monitoring", "stock", "pricing", "cli", "ci", "turkiye"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Point-Of-Sale",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = ["pydantic>=2.8", "httpx>=0.27", "pyyaml>=6.0"]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5",
  "mypy>=1.11",
  "ruff>=0.6",
  "respx>=0.21",
  "types-pyyaml",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[project.urls]
Homepage = "https://github.com/acar32furkan-glitch/marketplace-sentinel"
Issues = "https://github.com/acar32furkan-glitch/marketplace-sentinel/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20",
  "EM", "ISC", "ICN", "LOG", "G", "PIE", "PT", "Q", "RUF", "RET", "SIM",
  "TID", "ARG", "PTH", "PL", "TRY", "S", "BLE", "FBT", "ANN", "D",
]
ignore = [
  "D203", "D213", "D407", "D406", "D413", "D416", "D105", "D107",
  "TRY003", "TRY300", "TRY004", "EM101", "EM102",
  "PLR0913", "PLR0912", "PLR0915", "PLR0911", "PLR0917", "PLR2004",
  "ANN401", "S603", "S607", "S105", "S106", "S107", "FBT001", "FBT002", "RUF012", "SIM102",
  # Proje Türkçe metinlerle çalışır: diakritikler ve "%/·×" gibi işaretler kasıtlıdır.
  "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN201", "ANN001", "D100", "D101", "D102", "D103", "D104", "ARG001", "ARG002", "PLR2004", "T20"]
"scripts/*" = ["T201", "D103", "ANN201", "PLR2004"]
"src/sentinel/cli.py" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
files = ["src", "tests", "scripts"]
mypy_path = "src"
pretty = true

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: gerçek süreç/ağ gerektiren testler"]

[tool.coverage.run]
source = ["sentinel"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
