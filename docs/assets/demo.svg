  <text x="22" y="176" fill="#f87171" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" xml:space="preserve">  1. [KRİTİK] [STOK_CAKISMASI] sku-102 bir kanalda tükendi, diğerinde satışta (stok farkı 24)</text>
