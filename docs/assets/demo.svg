  <text x="22" y="328" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" xml:space="preserve">     aksiyon: Ucuz kanal satışı pahalı kanala kaydırıyor; marj kaybını önlemek için fiyatları eşitleyin ya da</text>
